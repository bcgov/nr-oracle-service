name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 11 * * 0" # 3 AM PST = 12 PM UDT, runs sundays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # https://github.com/marketplace/actions/aqua-security-trivy
  trivy:
    name: Trivy Security Scan
    if: (! github.event.pull_request.draft)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: .trivycache
          # Hashing the workflow file busts the cache whenever the trivy-action version changes.
          key: ${{ runner.os }}-trivy-${{ hashFiles('.github/workflows/analysis.yml') }}

      # Fails on fixable CRITICAL findings only
      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL"
          # Without this, SARIF output ignores severity and exit-code trips on any finding
          limit-severities-for-sarif: true
          exit-code: "1"
          cache-dir: .trivycache

      # PR uploads target the branch head ref so retries and merge-ref recalculations do not orphan the scan.
      - name: Upload Trivy scan results to GitHub Security tab (PR)
        if: always() && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sha: ${{ github.event.pull_request.head.sha }}

      # Push / schedule / workflow_dispatch on main use default ambient ref and sha.
      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          category: "trivy"
          sarif_file: "trivy-results.sarif"

  # Required merge gate for this workflow: add every new job id to needs.
  results:
    name: Analysis Results
    needs: [trivy]
    if: always() && (! github.event.pull_request.draft)
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@122a9b1c6c082b1b1f18c300020fbdc417b6b0b2 # v0.10.0
        with:
          needs: ${{ toJson(needs) }}
