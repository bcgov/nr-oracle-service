---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # v1.6+ breaks skip_packaging (helm/chart-releaser-action#171)
      - dependency-name: "helm/chart-releaser-action"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "maven"
    groups:
      # Majors stay ungrouped (one PR each) so they get individual review;
      # minor/patch bumps are low-risk and get bundled to cut PR noise.
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
